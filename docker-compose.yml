services:
  neo4j:
    image: neo4j:5.16.0
    container_name: analytical-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/analytical_system_2024
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - analytical-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: analytical-backend
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=analytical_system_2024
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      - neo4j
    volumes:
      - ./backend:/app
      - ./graph_data:/app/graph_data
    networks:
      - analytical-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analytical-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - analytical-network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:

networks:
  analytical-network:
    driver: bridge

